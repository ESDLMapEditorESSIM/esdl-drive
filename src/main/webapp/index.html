<!DOCTYPE html>
<html>
	<head>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
		<title>ESDL Drive browser</title>
		<meta name="viewport" content="width=device-width" />
		<link rel="stylesheet" href="//static.jstree.com/latest/assets/dist/themes/default/style.min.css" />

		<style>
		html, body { background:#ebebeb; font-size:12px; font-family:Verdana; margin:0; padding:0; }
		#container { min-width:320px; margin:0px auto 0 auto; background:white; border-radius:0px; padding:0px; overflow:hidden; }
		#tree { float:left; min-width:319px; border-right:1px solid silver; overflow:auto; padding:0px 0; }
		#data { margin-left:320px; }
		#data textarea { margin:0; padding:0; height:100%; width:100%; border:0; background:white; display:block; line-height:18px; resize:none; }
		#data, #code { font: normal normal normal 12px/18px 'Consolas', monospace !important; }

		#tree .file-esdl { background:url('/icons/esdl.png') right bottom no-repeat; }
		#tree .file-edd { background:url('/icons/edd_16.png') right bottom no-repeat; }
		#tree .folder-edr { background:url('/icons/edr3.png') right bottom no-repeat; }
		#tree .folder-drive { background:url('/icons/ESDLDrive-16.png') right bottom no-repeat; }
		#tree .folder { background:url('/icons/file_sprite.png') right bottom no-repeat; }
		#tree .file { background:url('icons/file_sprite.png') 0 0 no-repeat; }
		#tree .file-pdf { background-position: -32px 0 }
		#tree .file-as { background-position: -36px 0 }
		#tree .file-c { background-position: -72px -0px }
		#tree .file-iso { background-position: -108px -0px }
		#tree .file-htm, #tree .file-html, #tree .file-xml, #tree .file-xsl { background-position: -126px -0px }
		#tree .file-cf { background-position: -162px -0px }
		#tree .file-cpp { background-position: -216px -0px }
		#tree .file-cs { background-position: -236px -0px }
		#tree .file-sql { background-position: -272px -0px }
		#tree .file-xls, #tree .file-xlsx { background-position: -362px -0px }
		#tree .file-h { background-position: -488px -0px }
		#tree .file-crt, #tree .file-pem, #tree .file-cer { background-position: -452px -18px }
		#tree .file-php { background-position: -108px -18px }
		#tree .file-jpg, #tree .file-jpeg, #tree .file-png, #tree .file-gif, #tree .file-bmp { background-position: -126px -18px }
		#tree .file-ppt, #tree .file-pptx { background-position: -144px -18px }
		#tree .file-rb { background-position: -180px -18px }
		#tree .file-text, #tree .file-txt, #tree .file-md, #tree .file-log, #tree .file-htaccess { background-position: -254px -18px }
		#tree .file-doc, #tree .file-docx { background-position: -362px -18px }
		#tree .file-zip, #tree .file-gz, #tree .file-tar, #tree .file-rar { background-position: -416px -18px }
		#tree .file-js { background-position: -434px -18px }
		#tree .file-css { background-position: -144px -0px }
		#tree .file-fla { background-position: -398px -0px }
		</style>
	</head>
	<body>
		<div id="topwrapper" style="width: 100%; overflow: hidden;">
		<div style="width: 50%; height: 20px;margin: 5px; float: left;"><img src="icons/ESDLDrive-16.png" style="position: relative; top:2px"/><span>  </span><span style="font-weight: bold;">ESDL Drive</span></div>
		
				
		<div style="margin: 5px; overflow:hidden;text-align: right">
			<span><a href="/store/logout"><span>Logout</span></a><span>&nbsp;</span></span>  
        </div>
        </div>
        
		<div id="container" role="main">
			<div id="tree"></div>
			<div id="splitter" style="height: 100%; float: left;width:5px;min-width:5px;padding:0px;background:#d9edf7;border:solid 1px #bce8f1;cursor:col-resize"></div>
			<div id="data">
				<div class="content code" style="display:none;"><textarea id="code" readonly="readonly"></textarea></div>
				<div class="content folder" style="display:none;"></div>
				<div class="content image" style="display:none; position:relative;"><img src="" alt="" style="display:block; position:absolute; left:50%; top:50%; padding:0; max-height:90%; max-width:90%;" /></div>
				<div class="content default" style="text-align:center;">Select a file from the tree.</div>
				<div class="content esdl">ESDL</div>
			</div>
		</div>

		<script src="//static.jstree.com/latest/assets/dist/libs/jquery.js"></script>
		<script src="//static.jstree.com/latest/assets/dist/jstree.min.js"></script>
		<script>
		$(function () {
			$(window).resize(function () {
				var h = Math.max($(window).height() - 30, 420);
				$('#container, #data, #tree, #data .content').height(h).filter('.default').css('lineHeight', h + 'px');
			}).resize();

			$('#tree')
				.jstree({
					'core' : {
						'multiple': false,
						'data' : {
							'url' : '/store/browse?operation=get_node&depth=3',
							'data' : function (node) {
								return { 'id' : node.id };
							}
						},
						'check_callback' : function(operation, node, parent, i, m) {
							// m.pos => i=append, a=addAfter, b=addBefore
							if(m && m.dnd && m.pos !== 'i') { return false; }
							if(operation === "move_node" || operation === "copy_node") {
								if(this.get_node(node).parent === this.get_node(parent).id) { return false; }
							}
							if (parent.original === undefined ||
                            		!parent.original.writable ||
                            		!(parent.original.type === 'folder')) {
                            	return false;
                        	}
							
							return true;
						},
						'themes' : {
							'responsive' : false,
							'variant' : 'small',
							'stripes' : false
						}
					},
					'sort' : function(a, b) {
						return this.get_type(a) === this.get_type(b) ? (this.get_text(a) > this.get_text(b) ? 1 : -1) : (this.get_type(a) >= this.get_type(b) ? 1 : -1);
					},
					'contextmenu' : {
						'items' : function(node) {
							var tmp = $.jstree.defaults.contextmenu.items();
							console.log(tmp);
							console.log(node);
							delete tmp.create.action;
							tmp.create.label = "New";
							tmp.create.submenu = {
								"create_folder" : {
									"separator_after"	: true,
									"label"				: "Folder",
									"action"			: function (data) {
										var inst = $.jstree.reference(data.reference),
											obj = inst.get_node(data.reference);
										inst.create_node(obj, { type : "folder" }, "last", function (new_node) {
											setTimeout(function () { inst.edit(new_node); },0);
										});
									}
								},
								"create_file" : {
									"label"				: "File",
									"action"			: function (data) {
										var inst = $.jstree.reference(data.reference),
											obj = inst.get_node(data.reference);
										inst.create_node(obj, { type : "file" }, "last", function (new_node) {
											setTimeout(function () { inst.edit(new_node); },0);
										});
									}
								}
							};
							if (this.get_type(node) === 'folder') {
								tmp.refresh = {
	                                "label": "Refresh",
	                                "icon": "fa fa-refresh",
	                                "separator_before": true,
	                                "action": function (data) {
	                                    var inst = $.jstree.reference(data.reference),
	                                        obj = inst.get_node(data.reference);
	                                    //console.log(obj);
	                                    $('#tree').jstree(true).refresh_node(obj.parent);
	                                }
	                            };
	                        }
							if (this.get_type(node) !== "folder" || !node.original.writable) {
							    // don't add New menu if it is a file that is selected
								delete tmp.create;								
							}
							if (this.get_type(node) === 'folder' && !node.original.writable) {
								tmp.ccp._disabled = true;
							}
							if (this.get_type(node) !== 'folder' && !node.original.writable) {
								tmp.rename._disabled = true;
								tmp.remove._disabled = true;
								tmp.ccp.submenu.cut._disabled = true;
							}
							if (this.get_type(node) === 'folder' && !node.original.deletable) {
								tmp.rename._disabled = true;
								tmp.remove._disabled = true;
								tmp.ccp.submenu.cut._disabled = true;
                            	tmp.ccp.submenu.copy._disabled = true;
							}
							return tmp;
						}
					},
					'types' : {
						'default' : { 'icon' : 'file' },
						'folder' : { 'icon' : 'folder' },
						'file' : { 'valid_children' : [], 'icon' : 'file' }
					},
					'unique' : {
						'duplicate' : function (name, counter) {
							return name + ' ' + counter;
						}
					},
					'plugins' : ['state','dnd','sort','types','contextmenu','unique']
				})
				.on('delete_node.jstree', function (e, data) {
					$.get('/store/browse?operation=delete_node', { 'id' : data.node.id })
						.fail(function (response) {
							if (response.status == 403) { // PermissionDenied
								alert(response.responseJSON.error);
							}
							data.instance.refresh();
						});
				})
				.on('create_node.jstree', function (e, data) {
					$.get('/store/browse?operation=create_node', { 'type' : data.node.type, 'id' : data.node.parent, 'text' : data.node.text })
						.done(function (d) {
							data.instance.set_id(data.node, d.id);
							for(let key in d) {
							    data.node.original[key] = d[key];
							}
						})
						.fail(function (response) {
							if (response.status == 403) { // PermissionDenied
								alert(response.responseJSON.error);
							}
							data.instance.refresh();
						});
				})
				.on('rename_node.jstree', function (e, data) {
					$.get('/store/browse?operation=rename_node', { 'id' : data.node.id, 'text' : data.text })
						.done(function (d) {
							data.instance.set_id(data.node, d.id);
						})
						.fail(function (response) {
							if (response.status == 403) { // PermissionDenied
								alert(response.responseJSON.error);
							}
							data.instance.refresh();
						});
				})
				.on('move_node.jstree', function (e, data) {
					$.get('/store/browse?operation=move_node', { 'id' : data.node.id, 'parent' : data.parent })
						.done(function (d) {
							data.instance.load_node(data.parent);
							//data.instance.refresh();
						})
						.fail(function (response) {
							if (response.status == 403) { // PermissionDenied
								alert(response.responseJSON.error);
							}
							data.instance.refresh();
						});
				})
				.on('copy_node.jstree', function (e, data) {
					$.get('/store/browse?operation=copy_node', { 'id' : data.original.id, 'parent' : data.parent })
						.done(function (d) {
							data.instance.load_node(data.parent);
							//data.instance.refresh();
						})
						.fail(function (response) {
							if (response.status == 403) { // PermissionDenied
								alert(response.responseJSON.error);
							}
							data.instance.refresh();
						});
				})
				.on('changed.jstree', function (e, data) {
					if(data && data.selected && data.selected.length) {
						$.get('/store/browse?operation=get_content&id=' + data.selected.join(':'), function (d) {
							if(d && typeof d.type !== 'undefined') {
								$('#data .content').hide();
								console.log(d);
								switch(d.type) {
									case 'esdl':
									case 'edd':
										$t = $('<table>');
										for (let attr in d) {
											let $tr = $('<tr>');
											$tr.append($('<td>').html(attr));
											$tr.append($('<td>').html(d[attr]));
											$t.append($tr);
										}
										$('#data .esdl').empty();
										$('#data .esdl').append($t);
										if (d['path'] !== undefined) {
											$a = $('<a>').attr('href', "/store/resource"+d['path']).attr('download', "").text("Download");
											$('#data .esdl').append($a);
										}
										
										$('#data .esdl').show();
										break;
									case 'text':
									case 'txt':
									case 'md':
									case 'htaccess':
									case 'log':
									case 'sql':
									case 'php':
									case 'js':
									case 'json':
									case 'css':
									case 'html':
										$('#data .code').show();
										$('#code').val(d.content);
										break;
									case 'png':
									case 'jpg':
									case 'jpeg':
									case 'bmp':
									case 'gif':
										$('#data .image img').one('load', function () { $(this).css({'marginTop':'-' + $(this).height()/2 + 'px','marginLeft':'-' + $(this).width()/2 + 'px'}); }).attr('src',d.content);
										$('#data .image').show();
										break;
									default:
										$('#data .default').html(d.content).show();
										break;
								}
							}
						});
					}
					else {
						$('#data .content').hide();
						$('#data .default').html('Select a file from the tree.').show();
					}
				});
		});
				
		
		</script>
		<script>
			var leftPanel = $('#tree');
			var jDoc = $('#container');
			$('#splitter').mousedown(function (e) {
			    e.preventDefault();
			    jDoc.mousemove(function (e) {
			        e.preventDefault();
			        var x = e.pageX - leftPanel.offset().left;
					var windowWidth = $(window).width();
			        var min = windowWidth/10;
			        if (x > min && x < windowWidth && e.pageX < (windowWidth - min)) {  
			        	leftPanel.width(x);
			    		//jQuery("div#doc-content .markdown-body").each(function() {
			    		//	var delta = jQuery("#docAppPanel")[0].getBoundingClientRect().right - this.getBoundingClientRect().right - 30;
		    			//	var jThis = jQuery(this);
		    			//	jThis.css("max-width", jThis.width()+delta+"px");
			    		//});
			        }
				});
			});
		    jDoc.mouseup(function (e) {
		   	 	jDoc.unbind('mousemove');
			});
		</script>
	</body>
</html>
